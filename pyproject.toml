[project]
name = "mt5-mcp"
version = "0.1.0"
description = "Read-only MCP server for MetaTrader 5 research: terminals, broker profiles, history export, and Strategy Tester."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "MT5 MCP contributors" }]
keywords = ["mcp", "metatrader", "mt5", "backtest", "mql5"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "mcp>=2",
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[project.optional-dependencies]
parquet = ["pyarrow"]
dev = ["pytest>=7", "pytest-cov>=5", "ruff>=0.17.4", "pre-commit>=4"]

[project.scripts]
mt5-mcp = "mt5_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mt5_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mt5_mcp --cov-report=term-missing --cov-report=xml --cov-fail-under=67"

[tool.coverage.run]
source = ["src/mt5_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
