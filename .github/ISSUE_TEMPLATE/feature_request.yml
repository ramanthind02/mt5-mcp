name: Feature request
description: A research or backtest capability this server should grow
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This server stays read-only toward the trade server. A request to place, modify, or close live orders needs a clear reason to change that boundary.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What research or backtest task is hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should the tool, resource, or prompt do?
    validations:
      required: true
  - type: checkboxes
    id: orders
    attributes:
      label: Scope
      options:
        - label: This request keeps live order placement out of the server
          required: true
